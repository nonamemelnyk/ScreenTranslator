[project]
name = "screentranslator"
version = "0.1.0"
description = "A modular tool for capturing screenshots, recognizing text, translating it, and inserting the translated text back into the screenshot."
authors = [
    {name = "melnyk", email = "vm@scade.pro"}
]
readme = "README.md"
requires-python = ">=3.9,<4"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Utilities",
]
keywords = ["screenshot", "translation", "ocr", "text-recognition"]



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = ">=3.9,<4"
googletrans = "^4.0.2"
openai = "^1.76.2"
deepl = "^1.21.1"
pillow = "^11.2.1"
pytesseract = "^0.3.13"
pyautogui = "^0.9.54"
python-dotenv = "^1.0.0"
pynput = "^1.7.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.5.1"
black = "^25.1.0"

[tool.poetry.scripts]
screen_translator = "screentranslator.cli:main"

[tool.black]
line-length = 88
target-version = ["py39"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
